<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>SceneNFO</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><div class="app-icon">N</div><div><strong>SceneNFO</strong><span>Media intelligence</span></div></div>
    <nav>
      <button class="nav active" data-view="dashboard">⌂ <span>Dashboard</span></button>
      <div class="nav-label">Library</div>
      <button class="nav" data-view="movies">▣ <span>Movies</span></button>
      <button class="nav" data-view="tv">▤ <span>TV Shows</span></button>
      <div class="nav-label">Groups</div>
      <button class="nav" data-view="groups-scene">◎ <span>Scene</span></button>
      <button class="nav" data-view="groups-p2p">◉ <span>P2P</span></button>
      <div class="nav-label">Operations</div>
      <button class="nav" data-view="scan">↻ <span>Scan</span></button>
      <button class="nav" data-view="history">◷ <span>History</span></button>
      <button class="nav" data-view="logs">≡ <span>Logs</span></button>
      <div class="nav-label">System</div>
      <button class="nav" data-view="settings">⚙ <span>Settings</span></button>
    </nav>
    <div class="sidebar-footer"><span class="status-dot"></span><span>SceneNFO 0.1</span></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><h1 id="page-title">Dashboard</h1><p id="page-subtitle">Your media release overview</p></div>
      <div class="top-actions"><button class="btn secondary" id="refresh-btn">Refresh</button><button class="btn primary" id="quick-scan">Start Scan</button></div>
    </header>
    <section id="content"></section>
  </main>
</div>
<div id="toast" class="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
