<html lang="de">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <link rel="stylesheet" href="/static/styles.css?v=0.3.15" />

<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><div class="app-icon">N</div><div><strong>SceneNFO</strong><span>Media intelligence</span></div></div>
    <nav>
      <button class="nav active" data-view="dashboard">⌂ <span>Dashboard</span></button>
      <div class="nav-label">Library</div>
      <button class="nav" data-view="movies">▣ <span>Movies</span></button>
      <button class="nav" data-view="tv">▤ <span>TV</span></button>
      <div class="nav-label">Groups</div>
      <button class="nav" data-view="groups-scene">◎ <span>Scene</span></button>
      <button class="nav" data-view="groups-p2p">◉ <span>P2P</span></button>
      <div class="nav-label">Operations</div>
      <button class="nav" data-view="scan">↻ <span>Scan</span></button>
      <button class="nav" data-view="history">◷ <span>History</span></button>
      <button class="nav" data-view="logs">≡ <span>Logs</span></button>
      <div class="nav-label">System</div>
      <button class="nav" data-view="settings">⚙ <span>Settings</span></button>
    </nav>
    <div class="sidebar-footer"><span class="status-dot"></span><span>SceneNFO 0.3.15</span></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><h1 id="page-title">Dashboard</h1><p id="page-subtitle">Media overview and quick run</p></div>
      <div class="top-actions">
        <button class="btn secondary icon-btn" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">☾</button>
        <button class="btn secondary" id="refresh-btn">Refresh</button>
      </div>
    </header>
    <section id="content"></section>
  </main>
</div>
<div id="toast" class="toast"></div>
<script src="/static/incremental-ui.js?v=0.3.15"></script>
