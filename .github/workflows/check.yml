name: Check

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate frontend JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in app/static/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Validate P2P group seed
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows = json.loads(Path("app/data/p2p_groups.json").read_text())
          assert len(rows) == 73, f"Expected 73 groups, got {len(rows)}"
          assert len({row["name"].casefold() for row in rows}) == 73, "Duplicate P2P group names found"
          print("P2P group seed:", len(rows))
          PY
