name: Publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate frontend JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in app/static/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/mlo-tek/scenenfo:latest
            ghcr.io/mlo-tek/scenenfo:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=SceneNFO
            org.opencontainers.image.source=https://github.com/mlo-Tek/SceneNFO
            org.opencontainers.image.description=Scene/P2P release classification and Scene NFO management for Radarr and Sonarr libraries
